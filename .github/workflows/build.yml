# Drop-in replacement for .github/workflows/build.yml on a Build_JRE_NN branch.
name: Build and release OpenJDK for Android arm64

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub release"
        type: boolean
        default: true

env:
  JDK_MAJOR: 17

jobs:
  build_aarch64:
    name: Build for Android aarch64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build with CI build script
        run: bash ci_build_arch_aarch64.sh

      - name: Verify 16 KB page alignment
        run: |
          set -e
          READELF=$(ls -d android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64/bin | head -1)/llvm-readelf
          mkdir -p check && tar xJf jre${JDK_MAJOR}-arm64-*.tar.xz -C check
          bad=0
          for so in $(find check -name '*.so'); do
            if $READELF -l "$so" | awk '/^\s+LOAD/ {print $NF}' | grep -qvE '^0x(4000|10000)$'; then
              echo "not 16K aligned: $so"; bad=1
            fi
          done
          [ "$bad" = 0 ]

      - name: Collect release files
        run: |
          set -e
          mkdir -p release
          cp jre${JDK_MAJOR}-arm64-*.tar.xz release/
          cp openjdk/LICENSE openjdk/ADDITIONAL_LICENSE_INFO openjdk/ASSEMBLY_EXCEPTION release/ 2>/dev/null || true
          cp patches/*.diff release/
          (cd openjdk && git describe --tags --always) > release/SOURCE_TAG
          (cd release && sha256sum * > SHA256SUMS)
          ls -la release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jre${{ env.JDK_MAJOR }}-aarch64
          path: release/*

      - name: Publish release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: jre${{ env.JDK_MAJOR }}-${{ github.run_number }}
          name: JRE ${{ env.JDK_MAJOR }} for Android arm64 (build ${{ github.run_number }})
          body: |
            OpenJDK ${{ env.JDK_MAJOR }} built for Android arm64 (API 21+), headless, server VM,
            16 KB page aligned. GPLv2 with Classpath Exception; see LICENSE and
            ADDITIONAL_LICENSE_INFO. Source: openjdk/jdk${{ env.JDK_MAJOR }}u at the tag in
            SOURCE_TAG plus the included patch.
          files: release/*
